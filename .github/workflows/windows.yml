name: Windows app

on:
  push:
    branches: ["**"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZMFTheaters.exe
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish windows/ZMFTheaters.Windows/ZMFTheaters.Windows.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/single

      - name: Publish portable folder
        run: >
          dotnet publish windows/ZMFTheaters.Windows/ZMFTheaters.Windows.csproj -c Release -r win-x64 --self-contained true
          -o out/ZMFTheaters-Windows

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/ZMFTheaters-Windows/* -DestinationPath ZMFTheaters-Windows-x64.zip
          Copy-Item out/single/ZMFTheaters.exe ZMFTheaters.exe
          Get-Item ZMFTheaters.exe, ZMFTheaters-Windows-x64.zip | Format-Table Name, Length

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out/ZMFTheaters-Windows/ZMFTheaters.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "ZMFTheaters.exe exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "App is running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - name: 3D conversion self-test (Depth Anything V2 ONNX)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out/ZMFTheaters-Windows/ZMFTheaters.exe" -ArgumentList "--selftest-3d","$PWD/selftest.txt" -PassThru -Wait
          Get-Content selftest.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "3D self-test exit code $($p.ExitCode)"; exit 1 }

      - name: Render 3D cinema screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($shot in "lobby","hall","room","seat") {
            $p = Start-Process -FilePath "out/ZMFTheaters-Windows/ZMFTheaters.exe" -ArgumentList "--shot",$shot,"$PWD/shots/$shot.png" -PassThru
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Warning "$shot timed out" }
          }
          Get-ChildItem shots

      - name: Publish screenshots to the ci-screenshots-windows branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd shots
          git init -q -b ci-screenshots-windows
          git config user.name "zmf-ci"
          git config user.email "zmf-ci@users.noreply.github.com"
          git add . && git commit -q -m "Windows screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots-windows

      - uses: actions/upload-artifact@v4
        with:
          name: ZMFTheaters-Windows
          path: |
            ZMFTheaters.exe
            ZMFTheaters-Windows-x64.zip

      - name: Attach to the preview release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.3.0-preview
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "ZMF THEATERS+ v0.3 preview" --notes "iPhone IPA and Windows app builds from CI."
          gh release upload "$TAG" ZMFTheaters.exe ZMFTheaters-Windows-x64.zip --clobber
